name: Photo candidates (temporary)
on:
  push:
    branches: [ccr-d0d5d971-x5sn8r]
    paths: [scripts/find-photos.mjs]
permissions:
  contents: write
jobs:
  find:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/find-photos.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scratch
          git commit -qm "Photo candidates (temporary)"
          git push
